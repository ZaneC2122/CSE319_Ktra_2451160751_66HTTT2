<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Phiếu Mượn Sách</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Quản lý Phiếu Mượn Sách</h1>
        </header>

        <!-- Statistics Section -->
        <section class="statistics">
            <div class="stat-card">
                <h3>Tổng số phiếu mượn</h3>
                <p id="totalBorrows" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Đang mượn</h3>
                <p id="activeBorrows" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Đã trả</h3>
                <p id="returnedBorrows" class="stat-number">0</p>
            </div>
        </section>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="addBorrowBtn" class="btn btn-primary">Thêm phiếu mượn</button>
        </div>

        <!-- Borrow List Table -->
        <section class="borrow-list">
            <div class="table-wrapper">
                <table id="borrowTable" class="table">
                    <thead>
                        <tr>
                            <th>Mã phiếu mượn</th>
                            <th>Họ tên người mượn</th>
                            <th>Mã sách</th>
                            <th>Thể loại</th>
                            <th>Ngày mượn</th>
                            <th>Hạn trả</th>
                            <th>Số điện thoại</th>
                            <th>Email</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="borrowTableBody">
                        <!-- Data will be filled by JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="noDataMessage" class="no-data">Chưa có phiếu mượn nào</p>
        </section>
    </div>

    <!-- Modal Form: Add/Edit Borrow -->
    <div id="borrowModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm phiếu mượn</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="borrowForm" class="borrow-form">
                <div class="form-group">
                    <label for="borrowId">Mã phiếu mượn <span class="required">*</span></label>
                    <input type="text" id="borrowId" name="borrowId" placeholder="VD: PM-2048">
                </div>

                <div class="form-group">
                    <label for="borrowerName">Họ tên người mượn <span class="required">*</span></label>
                    <input type="text" id="borrowerName" name="borrowerName" placeholder="Nhập đầy đủ họ tên">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bookId">Mã sách <span class="required">*</span></label>
                        <input type="text" id="bookId" name="bookId" placeholder="VD: BK10234">
                    </div>
                    <div class="form-group">
                        <label for="category">Thể loại sách <span class="required">*</span></label>
                        <select id="category" name="category">
                            <option value="">-- Chọn thể loại --</option>
                            <option value="CNTT">CNTT</option>
                            <option value="Kinh tế">Kinh tế</option>
                            <option value="Ngoại ngữ">Ngoại ngữ</option>
                            <option value="Kỹ năng">Kỹ năng</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="borrowDate">Ngày mượn <span class="required">*</span></label>
                        <input type="date" id="borrowDate" name="borrowDate">
                    </div>
                    <div class="form-group">
                        <label for="returnDeadline">Hạn trả <span class="required">*</span></label>
                        <input type="date" id="returnDeadline" name="returnDeadline">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Số điện thoại liên hệ <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="0123456789">
                    </div>
                    <div class="form-group">
                        <label for="email">Email liên hệ <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="example@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">Trạng thái mượn <span class="required">*</span></label>
                    <select id="status" name="status">
                        <option value="">-- Chọn trạng thái --</option>
                        <option value="Đang mượn">Đang mượn</option>
                        <option value="Đã trả">Đã trả</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Ghi chú</label>
                    <textarea id="notes" name="notes" placeholder="Nhập ghi chú nếu cần..." rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Lưu</button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Dialog -->
    <div id="confirmDialog" class="modal">
        <div class="modal-content confirm-dialog">
            <h2>Xác nhận xóa</h2>
            <p id="confirmMessage">Bạn có chắc chắn muốn xóa phiếu mượn này?</p>
            <div class="dialog-actions">
                <button id="confirmDeleteBtn" class="btn btn-danger">Xóa</button>
                <button id="cancelDeleteBtn" class="btn btn-cancel">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="validate.js"></script>
    <script src="script.js"></script>
</body>
</html>
